catalog_path: config/fineract_catalog.json
annotations_path: config/fineract_annotations.yaml
max_selected_databases: 1
max_selected_tables: 25
min_route_score: 0.0
max_rows: 100
max_sql_iterations: 5
# 285 tables — rank lexically to avoid embedding every table per query (free-tier
# embedding quota is ~100 docs/min). Table names + annotations carry the domain words.
table_selection_embeddings: false

databases:
  - id: fineract
    name: Fineract Core Banking
    description: >-
      Apache Fineract core banking system. Clients (m_client), their offices
      (m_office) and loan officers (m_staff). Loan accounts (m_loan) with
      products (m_product_loan), disbursements and repayments (m_loan_transaction).
      Savings accounts (m_savings_account) with products (m_savings_product) and
      deposits/withdrawals (m_savings_account_transaction). Payments, charges,
      currencies, and enum-coded statuses decoded via r_enum_value.
    uri_env: DATABASE_URL_FINERACT
    dialect: postgres
    include_tables: []
    blocked_tables: []
    blocked_columns: []
    auto_block_sensitive_columns: true
    sample_rows: 0

# The operations screen investigates one loan account at a time. Every query the
# agent runs is pinned to the selected loan through these columns, so a run can
# read that loan's transactions, schedule and arrears but never the portfolio.
ops:
  database_id: fineract
  table: m_loan
  key_column: id
  label_columns: [account_no]
  search_columns: [account_no, external_id]
  detail_columns: [principal_amount, loan_status_id, currency_code]
  # Other tables carry the loan's key under these names.
  alias_columns: [loan_id]
  # The loan's own row points at its client, so that client's record is in scope too.
  related_columns:
    client_id: m_client.id
  # Enum decode tables hold no customer data, so they need no loan filter.
  reference_tables: [r_enum_value]
  default_question: >-
    Summarise this loan account: its status, what has been repaid, whether it is
    in arrears, and anything an operator should act on.
