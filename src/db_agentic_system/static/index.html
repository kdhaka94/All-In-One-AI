<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Database Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        let storedTheme = null;
        try {
          const value = localStorage.getItem("db-agent-theme");
          storedTheme = value === "dark" || value === "light" ? value : null;
        } catch {
          storedTheme = null;
        }
        const prefersDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = storedTheme || (prefersDark ? "dark" : "light");
      })();
    </script>
    <link rel="stylesheet" href="/static/styles.css?v=20260711-2" />
  </head>
  <body>
    <main id="shell" class="shell">
      <header class="topbar">
        <div class="topbar-left">
          <button id="toggleSidebar" class="icon-btn" type="button" title="Toggle sidebar" aria-label="Toggle sidebar">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
          </button>
          <div class="brand topbar-brand">
            <div class="mark">DB</div>
            <div class="brand-text">
              <h1>Database Agent</h1>
              <p id="statusText" class="brand-status">Checking runtime</p>
            </div>
          </div>
        </div>
        <div class="header-actions">
          <button id="toggleTheme" class="icon-btn theme-toggle" type="button" title="Switch to dark mode" aria-label="Switch to dark mode">
            <svg class="theme-icon theme-icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            <svg class="theme-icon theme-icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.99 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 20.99 12.79Z"/></svg>
          </button>
          <button id="toggleTrace" class="icon-btn" type="button" title="Toggle trace panel" aria-label="Toggle trace panel">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><line x1="15" y1="4" x2="15" y2="20"/></svg>
          </button>
        </div>
      </header>

      <aside class="sidebar">
        <div class="brand">
          <div class="mark">DB</div>
          <div class="brand-text">
            <h1>Controls</h1>
            <p class="brand-status">Config and routing</p>
          </div>
        </div>

        <div class="field-group">
          <label class="field">
            <span class="eyebrow">Config Profile</span>
            <select id="profileSelect" class="field-select">
              <option value="">Loading profiles</option>
            </select>
          </label>
          <div id="profileDetails" class="profile-details muted">Config, catalog, and schema source are selected together.</div>

          <label class="field">
            <span class="eyebrow">Database</span>
            <select id="databaseSelect" class="field-select">
              <option value="">Auto-route</option>
            </select>
          </label>

          <label class="field">
            <span class="eyebrow">AI Model</span>
            <select id="modelSelect" class="field-select">
              <option value="">Default</option>
            </select>
          </label>
        </div>

        <div class="actions">
          <button id="indexButton" class="btn btn-primary">Index Catalog</button>
          <button id="resetButton" class="btn btn-secondary">Reset Chat</button>
        </div>

        <div class="selected-panel">
          <span class="eyebrow">Selected</span>
          <div id="selectedDatabases" class="pill-row muted">No query yet</div>
        </div>
      </aside>

      <section class="chat">
        <div class="chat-scroll">
          <div id="messages" class="messages"></div>
        </div>
        <div class="composer-wrap">
          <form id="chatForm" class="composer">
            <textarea
              id="messageInput"
              rows="1"
              autocomplete="off"
              placeholder="Ask a database question…"
            ></textarea>
            <button id="sendButton" class="send-btn" type="submit" aria-label="Send">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </form>
          <div class="composer-hint">Follow-ups use this chat session as context.</div>
        </div>
      </section>

      <aside class="trace">
        <div class="trace-header">
          <span class="trace-title">Trace</span>
          <span id="sessionBadge" class="trace-session">New session</span>
        </div>
        <div id="trace" class="trace-body">
          <p class="muted">Generated SQL, validation errors, and result previews appear here.</p>
        </div>
      </aside>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="/static/app.js?v=20260721-model"></script>
  </body>
</html>
